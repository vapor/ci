name: benchmark
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sha }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: false
        description: "The commit SHA to run the benchmarks against. Will use current ref if not provided."
      swift_image:
        type: string
        default: swift:noble
        description: "The Swift container image used for builds and measurements."
      runner_labels:
        type: string
        default: runner=2cpu-4ram
        description: "RunsOn labels selecting the benchmark hardware, excluding the runs-on run ID."
      configurations:
        type: string
        default: '[{}]'
        description: "JSON array of named configurations with build, build_configuration, swift_flags and environment fields."
      environment:
        type: string
        default: '{}'
        description: "JSON object of environment variables applied to every configuration."
      validate_thresholds:
        type: boolean
        default: false
        description: "Require nonempty results and matching metric keys in committed thresholds."
      record_thresholds:
        type: boolean
        default: false
        description: "Export thresholds for review instead of comparing committed thresholds."
permissions:
  contents: read
  id-token: write
env:
  RUN_LINK: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  BENCHMARK_CONFIGURATIONS: ${{ inputs.configurations }}
  BENCHMARK_ENVIRONMENT: ${{ inputs.environment }}
  BENCHMARK_RUNNER_LABELS: ${{ inputs.runner_labels }}
  VALIDATE_THRESHOLDS: ${{ inputs.validate_thresholds }}
  CHECK_NAME: "benchmark / benchmark-vs-thresholds"

jobs:
  benchmark-vs-thresholds:
    # https://runs-on.com/features/custom-runners/
    runs-on: runs-on=${{ github.run_id }}/${{ inputs.runner_labels }}
    container:
      image: ${{ inputs.swift_image }}
      options: --privileged
    
    env:
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_REFNAME: ${{ github.ref_name }}

    defaults:
      run:
        shell: bash --noprofile --norc -e -u -o pipefail {0}

    steps:
      - name: Configure RunsOn
        uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1

      # jemalloc is a dependency of the Benchmarking package
      # actions/cache will detect zstd and will become much faster.
      - name: Install jemalloc, zstd, curl and jq
        run: |
          apt-get update -q && apt-get install -yq libjemalloc-dev zstd curl jq

      - name: Configure benchmark command
        id: benchmark-configuration
        run: |
          cat > "${RUNNER_TEMP}/run-benchmark" <<'BENCHMARK_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          # Unnamed configuration preserves the original single-run command and paths.
          configurations=${BENCHMARK_CONFIGURATIONS:-'[{}]'}
          environment=${BENCHMARK_ENVIRONMENT:-'{}'}
          validate=${VALIDATE_THRESHOLDS:-false}

          if ! jq -e '
            def slug: type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]*$");
            def environment: type == "object" and all(to_entries[];
              (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) and
              (.value | type == "string" and (contains("\u0000") | not)));
            type == "array" and length > 0 and
            all(.[]; type == "object" and
              ((keys - ["name", "build", "build_configuration", "swift_flags", "environment"]) | length == 0) and
              ((.name // "") | . == "" or slug) and
              ((.build // .name // "") | . == "" or slug) and
              ((.build_configuration // "release") | . == "debug" or . == "release") and
              ((.swift_flags // []) | type == "array" and all(.[]; type == "string" and (contains("\u0000") | not))) and
              ((.environment // {}) | environment)) and
            (length == 1 or all(.[]; (.name // "") != "")) and
            ((map(.name // "") | unique | length) == length) and
            (group_by(.build // .name // "") | all(.[]; (map(.swift_flags // []) | unique | length) == 1))
          ' <<< "$configurations" >/dev/null; then
            echo 'Invalid benchmark configurations: use unique names, debug/release builds and identical Swift flags for shared build directories.' >&2
            exit 30
          fi
          if ! jq -e 'type == "object" and all(to_entries[];
            (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) and
            (.value | type == "string" and (contains("\u0000") | not)))' <<< "$environment" >/dev/null; then
            echo 'Benchmark environment must map variable names to strings.' >&2
            exit 30
          fi
          if [[ "${1:-}" == --validate ]]; then exit 0; fi

          category=$1
          operation=$2
          title=$3
          shift 3
          case "${category}/${operation}" in
            baseline/update|baseline/read|thresholds/update|thresholds/check) ;;
            *) echo 'Unsupported benchmark operation.' >&2; exit 30 ;;
          esac

          regressions=0
          improvements=0
          failure=0
          record_status() {
            case "$1" in
              0) ;;
              1) regressions=1; improvements=1 ;;
              2) regressions=1 ;;
              4) improvements=1 ;;
              *) failure=$1 ;;
            esac
          }

          # Check coverage only. The benchmark package owns metric values and comparisons.
          check_coverage() {
            local current=$1 reference=${2:-} file original count=0
            while IFS= read -r -d '' file; do
              count=$((count + 1))
              if ! jq -e 'type == "object" and length > 0' "$file" >/dev/null; then
                echo "Missing metric results in ${file}"
                return 30
              fi
              if [[ -n "$reference" ]]; then
                original="${reference}/${file#"${current}/"}"
                if [[ ! -f "$original" ]] || ! jq -e --slurpfile current "$file" '
                  type == "object" and keys == ($current[0] | keys)
                ' "$original" >/dev/null; then
                  echo "Missing or incompatible thresholds: ${original}"
                  return 30
                fi
              fi
            done < <(find "$current" -type f -name '*.p90.json' -print0)
            if [[ "$count" == 0 ]]; then echo 'No benchmark results were exported.'; return 30; fi
          }

          while IFS= read -r configuration; do
            name=$(jq -r '.name // ""' <<< "$configuration")
            build=$(jq -r '.build // .name // ""' <<< "$configuration")
            baseline=$title
            thresholds=Benchmarks/Thresholds
            if [[ -n "$name" ]]; then
              baseline="ci-${name}"
              thresholds="${thresholds}/${name}"
              printf '\n## %s\n\n' "$name"
            fi

            command=(env)
            while IFS= read -r -d '' variable; do command+=("$variable"); done < <(
              jq -j --argjson common "$environment" '($common + (.environment // {})) | to_entries[] | .key + "=" + .value, "\u0000"' <<< "$configuration"
            )
            command+=(swift package -c release --disable-sandbox --package-path Benchmarks)
            if [[ -n "$build" ]]; then command+=(--scratch-path "Benchmarks/.build/${build}"); fi
            while IFS= read -r -d '' flag; do command+=("$flag"); done < <(
              jq -j '.swift_flags[]? | ., "\u0000"' <<< "$configuration"
            )
            command+=(benchmark)
            if [[ "$(jq -r '.build_configuration // "release"' <<< "$configuration")" == debug ]]; then
              command+=(--benchmark-build-configuration debug)
            fi

            if [[ "$category" == baseline ]]; then
              "${command[@]}" baseline "$operation" "$baseline" "$@"
            elif [[ "$operation" == update ]]; then
              "${command[@]}" thresholds update "$baseline" --path "$thresholds" "$@"
              if [[ "$validate" == true ]]; then check_coverage "$thresholds"; fi
            else
              if [[ "$validate" == true ]]; then
                current=$(mktemp -d)
                if ! ("${command[@]}" thresholds update "$baseline" --path "$current" && check_coverage "$current" "$thresholds"); then
                  record_status 30
                  rm -rf "$current"
                  continue
                fi
                rm -rf "$current"
              fi
              status=0
              "${command[@]}" thresholds check "$baseline" --path "$thresholds" "$@" || status=$?
              record_status "$status"
            fi
          done < <(jq -c '.[]' <<< "$configurations")

          if [[ "$failure" != 0 ]]; then exit "$failure"; fi
          if [[ "$regressions" == 1 && "$improvements" == 1 ]]; then exit 1; fi
          if [[ "$regressions" == 1 ]]; then exit 2; fi
          if [[ "$improvements" == 1 ]]; then exit 4; fi
          BENCHMARK_SCRIPT
          chmod +x "${RUNNER_TEMP}/run-benchmark"
          "${RUNNER_TEMP}/run-benchmark" --validate
          CONFIGURATION_HASH=$(printf '%s\n%s\n%s' "${BENCHMARK_CONFIGURATIONS}" "${BENCHMARK_ENVIRONMENT}" "${BENCHMARK_RUNNER_LABELS}" | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=${CONFIGURATION_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Find commit info
        id: commit-info
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [[ -n "${INPUT_SHA}" ]]; then
            FULL_SHA="$(curl "https://api.github.com/repos/${GITHUB_REPO}/commits/${INPUT_SHA}" | jq -r '.sha')"

            # Get the oldest PR that contains the commit
            PR="$(
              curl "https://api.github.com/search/issues?q=${FULL_SHA}" | \
                jq --arg repo "${GITHUB_REPO}" 'select(.items[].pull_request.url | contains("/\($repo)/")) | .items[-1]'
            )"

            # PR title, removing all occurrences of `'`
            PR_TITLE="$(echo "${PR}" | jq -r '.title' | tr -d "'")"
            PR_NUMBER="$(echo "${PR}" | jq -r '.number')"

            if [[ -z "${PR_NUMBER}" ]]; then
              echo "failed to find PR info for commit '${INPUT_SHA}'"
              exit 1
            fi

            echo "ref=${FULL_SHA}" >> "${GITHUB_OUTPUT}"
            echo "sha=${FULL_SHA}" >> "${GITHUB_OUTPUT}"
            echo "title=${PR_TITLE}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
            SHORT_NAME="$(echo "${FULL_SHA}" | cut -c 1-7)"
            FILES_LINK="https://github.com/${GITHUB_REPO}/pull/${PR_NUMBER}/commits/${FULL_SHA}"
          else
            echo "ref=${GITHUB_REF}" >> "${GITHUB_OUTPUT}"
            echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "title=${GITHUB_REFNAME}" >> "${GITHUB_OUTPUT}"
            echo 'pr_number=' >> "${GITHUB_OUTPUT}"
            SHORT_NAME="${GITHUB_REFNAME}"
            FILES_LINK="https://github.com/${GITHUB_REPO}/commit/${GITHUB_SHA}"
          fi

          echo "md_link=[${SHORT_NAME}](${FILES_LINK})" >> "${GITHUB_OUTPUT}"

      - name: Create penny-bot token
        if: steps.commit-info.outputs.pr_number != ''
        id: create-penny-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PENNY_APP_ID }}
          private-key: ${{ secrets.PENNY_APP_PRIVATE_KEY }}

      - name: Construct in-progress comment
        if: steps.commit-info.outputs.pr_number != ''
        env:
          MD_LINK: ${{ steps.commit-info.outputs.md_link }}
        run: |
          echo "## [Benchmark](${RUN_LINK}) Report for ${MD_LINK}" >> in-progress-comment.md
          echo 'Benchmark in progress...' >> in-progress-comment.md

      - name: Comment in PR
        if: steps.commit-info.outputs.pr_number != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.commit-info.outputs.pr_number }}
          file-path: in-progress-comment.md
          comment-tag: benchmark-ci-comment
          github-token: ${{ steps.create-penny-token.outputs.token }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: "${{ steps.commit-info.outputs.ref }}"
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Cache .build as needed
        if: ${{ runner.debug != '1' }}
        uses: actions/cache@v6
        with:
          path: Benchmarks/.build
          key: "swiftpm-benchmark-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.swift_image }}-${{ steps.benchmark-configuration.outputs.cache-key }}-${{ steps.commit-info.outputs.sha }}"
          restore-keys: "swiftpm-benchmark-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.swift_image }}-${{ steps.benchmark-configuration.outputs.cache-key }}-"

      - name: "Run benchmarks for ${{ steps.commit-info.outputs.title }}"
        env:
          TITLE: ${{ steps.commit-info.outputs.title }}
        run: |
          "${RUNNER_TEMP}/run-benchmark" baseline update \
            "${TITLE}"

      - name: Read benchmark result
        env:
          TITLE: ${{ steps.commit-info.outputs.title }}
        run: |
          "${RUNNER_TEMP}/run-benchmark" baseline read \
            "${TITLE}" \
            --format markdown \
            | tee -a benchmark.md

      - name: "Compare ${{ steps.commit-info.outputs.title }} against thresholds"
        if: ${{ !inputs.record_thresholds }}
        id: comparison
        env:
          TITLE: ${{ steps.commit-info.outputs.title }}
        run: |
          TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "## Benchmark check running at ${TIMESTAMP}" | tee -a comparison.md

          # Disable 'set -e' to prevent the script from exiting on non-zero exit codes
          set +e
          "${RUNNER_TEMP}/run-benchmark" thresholds check \
           "${TITLE}" \
            --format markdown \
            | tee -a comparison.md
          echo "exit-status=$?" >> "${GITHUB_OUTPUT}"
          set -e

      - name: Record thresholds for review
        if: inputs.record_thresholds
        env:
          TITLE: ${{ steps.commit-info.outputs.title }}
        run: |
          "${RUNNER_TEMP}/run-benchmark" thresholds update "${TITLE}"
          echo 'Thresholds were recorded on this runner. Download the benchmark-thresholds artifact, review the values, and commit them before enabling threshold checks.' > comparison.md

      - name: Upload recorded thresholds
        if: inputs.record_thresholds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-thresholds
          path: Benchmarks/Thresholds/
          if-no-files-found: error

      - name: Upload full benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports
          path: |
            benchmark.md
            comparison.md
          if-no-files-found: error

      - name: Construct result comment
        env:
          MD_LINK: ${{ steps.commit-info.outputs.md_link }}
          STATUS: ${{ inputs.record_thresholds && 'recorded' || steps.comparison.outputs.exit-status }}
        run: |
          echo "## [Benchmark](${RUN_LINK}) Report for ${MD_LINK}" | tee -a comment.md
          case "${STATUS}" in
              recorded) echo '**Thresholds recorded for review; no performance comparison was performed.**' | tee -a comment.md ;;
              0) echo '**✅ Pull request has no significant performance differences ✅**' | tee -a comment.md ;;
              1) echo '**❓ Pull request has significant performance differences 📊**' | tee -a comment.md ;;
              2) echo '**❌ Pull request has significant performance regressions 📉**' | tee -a comment.md ;;
              4) echo '**⚠️ Pull request has significant performance improvements 📈**' | tee -a comment.md ;;
              *) echo "**🚫 Benchmark comparison failed with unknown exit code ${STATUS} 🚫**" | tee -a comment.md ;;
          esac

          # Large suites can exceed GitHub's 65,536-character comment limit.
          # Keep full reports in the artifact.
          for REPORT in comparison benchmark; do
            jq -Rrs 'if length > 20000 then
              .[:20000] + "\n\nReport truncated. Download benchmark-reports from the linked run for the full results.\n"
              else . end' "${REPORT}.md" > "${REPORT}-comment.md"
          done

          printf '<details>\n  <summary>Click to expand comparison result</summary>\n\n%s\n\n</details>\n\n' "$(cat comparison-comment.md)" | tee -a comment.md
          printf '<details>\n  <summary>Click to expand benchmark result</summary>\n\n%s\n\n</details>\n\n' "$(cat benchmark-comment.md)" | tee -a comment.md

      - name: Update comment in PR
        if: steps.commit-info.outputs.pr_number != ''
        id: pr-comment
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.commit-info.outputs.pr_number }}
          file-path: comment.md
          comment-tag: benchmark-ci-comment
          github-token: ${{ steps.create-penny-token.outputs.token }}

      - name: Output the comment as job summary
        env:
          PR: ${{ steps.commit-info.outputs.pr_number }}
          HTML_URL: ${{ steps.pr-comment.outputs.html-url }}
        run: |
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n "${PR}" ]]; then
            echo "Commented at [PR comment](${HTML_URL})" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Update commit status
        if: steps.commit-info.outputs.pr_number != '' && !inputs.record_thresholds
        env:
          STATUS: ${{ steps.comparison.outputs.exit-status }}
          SHA: ${{ steps.commit-info.outputs.sha }}
          TOKEN: ${{ steps.create-penny-token.outputs.token }}
        run: |
          STATE=$([ "${STATUS}" == '0' ] && echo 'success' || echo 'failure')
          BODY="$(
            jq -n \
              --arg state "${STATE}" \
              --arg url "${RUN_LINK}" \
              --arg context "${CHECK_NAME}" \
              '{state: $state, target_url: $url, context: $context}'
          )"
          curl -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPO}/statuses/${SHA}" \
            -d "${BODY}"

      - name: Exit with correct status
        if: ${{ !inputs.record_thresholds }}
        env:
          STATUS: ${{ steps.comparison.outputs.exit-status }}
        run: exit "${STATUS}"
